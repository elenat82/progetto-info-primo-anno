<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tali e Quadri</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="https://kit.fontawesome.com/6d3b88364d.js" crossorigin="anonymous"></script>
</head>

<body class="light-background">
    <header>
        <div id="topbar">
            <form action="#" method="get" id="cerca" role="search">
                <label for="keyword">Cerca</label>
                <input type="search" name="keyword" id="keyword" maxlength="50"
                    aria-label="Cerca per artista, titolo o parola chiave" aria-placeholder="Cerca"
                    placeholder="Cerca..."> <button class="primary-background text-bold"><span
                        class="fas fa-search secondary-color-light" aria-hidden="true"></span></button>
            </form>
            <div id="logo" class="text-center">
                <a href="index.html" title="Home">
                    <img src="img/logo.svg" alt="Logo" width="100">
                    <h1 class="primary-color text-right text-bold">Tali e Quadri</h1>
                </a>
            </div>
            <ul id="user-menu">
                <li><a href="account.html" title="Vai alla pagina Account"><span class="far fa-user primary-color" aria-hidden="true"></span>
                        Account</a></li>
                <li><a href="carrello.html" title="Vai alla pagina Carrello"><span class="fas fa-shopping-cart primary-color" aria-hidden="true"></span> Carrello</a></li>
            </ul>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" title="Vai alla pagina Home" accesskey="h" class="primary-color text-bold">HOME</a></li>
                <li><a href="chisiamo.html" title="Vai alla pagina Chi siamo" accesskey="s" class="primary-color text-bold">CHI
                        SIAMO</a></li>
                <li><a href="artisti.html" title="Vai alla pagina Artisti" accesskey="a"
                        class="primary-color text-bold">ARTISTI</a></li>
                <li><a href="contatti.html" title="Vai alla pagina Contatti" accesskey="c"
                        class="primary-color text-bold menu-active">CONTATTI</a></li>
                <li><a href="ricerca.html" title="Vai alla pagina Ricerca" accesskey="r"
                        class="secondary-background-dark text-bold">Partecipa alla ricerca!</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container_form">
            <form action="thankyou-page.html" method="POST" id="contatti">
                <label for="fname">Nome <span>*</span></label><br>
                <input type="text" id="fname" name="fname" placeholder="Inserisci il tuo nome" required><br>
                <label for="lname">Cognome <span>*</span></label><br>
                <input type="text" id="lname" name="lname" placeholder="Inserisci il tuo congnome" required><br>
                <label for="email">E-mail <span>*</span></label><br>
                <input type="email" id="email" name="email" placeholder="Inserisci la tua email" required><br>
                <label for="messaggio">Messaggio <span>*</span></label><br>
                <textarea id="messaggio" name="messaggio" placeholder="Inserisci il tuo messaggio" rows="5" required></textarea>
                <button type="submit" class="primary-background secondary-color-light text-bold">INVIA</button>
            </form>
        </div>
    </main>
</body>

</html>
